# ──────────────────────────────────────────────────────────────
#  hypridle — Idle manager, gọi hyprlock khi rảnh
#  Timeline: 2' giảm sáng → 5' khóa → 5.5' tắt màn hình → 30' suspend
# ──────────────────────────────────────────────────────────────

general {
    # scripts/lock.sh: đồng bộ wallpaper awww rồi mới mở hyprlock
    # pidof chặn việc chạy 2 instance hyprlock chồng nhau
    lock_cmd = pidof hyprlock || /home/khoa/.config/hypr/scripts/lock.sh
    # khóa trước khi ngủ (suspend) — dùng loginctl để tất cả locker nhận event
    before_sleep_cmd = loginctl lock-session
    # bật lại màn hình ngay khi thức dậy, không cần bấm phím
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
    ignore_dbus_inhibit = false
}

# 2 phút: giảm sáng màn hình 30% (tiết kiệm pin, đỡ chói mắt)
listener {
    timeout = 120
    on-timeout = brightnessctl -s set 30
    on-resume = brightnessctl -r
}

# 2 phút: tắt đèn bàn phím (laptop ASUS)
listener {
    timeout = 120
    on-timeout = brightnessctl -sd asus::kbd_backlight set 0
    on-resume = brightnessctl -rd asus::kbd_backlight
}

# 5 phút: khóa màn hình
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5.5 phút: tắt màn hình (30s sau khi khóa để khỏi bị "chớp" khi đang gõ mật khẩu)
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# 30 phút: suspend
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
