# ──────────────────────────────────────────────────────────────
#  hyprlock — đồng bộ theme với modules/theme.lua
#  accent #A0D8EF · nền tối · ComicShannsMono Nerd Font
# ──────────────────────────────────────────────────────────────

$font       = ComicShannsMono Nerd Font Mono
$accent     = rgba(160, 216, 239, 1)      # #A0D8EF — trùng active_border trong theme.lua
$accent_dim = rgba(160, 216, 239, 0.55)
$text       = rgba(238, 242, 246, 1)
$text_dim   = rgba(238, 242, 246, 0.65)
$card       = rgba(18, 20, 26, 0.62)      # gần màu shadow 1a1a1a trong theme.lua
$card_border= rgba(160, 216, 239, 0.35)

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = false
    text_trim = true
    fractional_scaling = 2
    screencopy_mode = 0
}

animations {
    enabled = true
    bezier = overshot, 0.15, 0.85, 0.15, 1
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 3, linear
    animation = inputFieldDots, 1, 2, linear
}

# ── Nền: symlink do scripts/lock.sh cập nhật theo wallpaper hiện tại của awww ──
# Blur nhẹ (2 lớp, size nhỏ) để vẫn nhận ra wallpaper, đồng thời card giữa vẫn nổi
background {
    monitor =
    path = /home/khoa/.config/hypr/lock-bg.png
    blur_passes = 1
    blur_size = 4
    noise = 0
    contrast = 0.95
    brightness = 0.85
    vibrancy = 0.1696
    vibrancy_darkness = 0.35
}

# ── Thẻ card ở giữa màn hình ──
shape {
    monitor =
    size = 420, 480
    rounding = 16
    border_size = 2
    border_color = $card_border
    color = $card

    position = 0, 0
    halign = center
    valign = center
}

# Icon khóa
label {
    monitor =
    text = 
    font_size = 44
    font_family = $font
    color = $accent

    position = 0, 182
    halign = center
    valign = center
}

# Đồng hồ
label {
    monitor =
    text = $TIME
    font_size = 62
    font_family = $font
    color = $text

    position = 0, 96
    halign = center
    valign = center
}

# Ngày tháng (cập nhật mỗi 60s)
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 17
    font_family = $font
    color = $text_dim

    position = 0, 34
    halign = center
    valign = center
}

# Chào user
label {
    monitor =
    text =  Hi, $USER
    font_size = 20
    font_family = $font
    color = $text

    position = 0, -52
    halign = center
    valign = center
}

# ── Ô nhập mật khẩu ──
input-field {
    monitor =
    size = 340, 56
    outline_thickness = 3

    inner_color = rgba(255, 255, 255, 0.07)
    outer_color = $accent_dim
    check_color = rgba(a0d8efee) rgba(78c8ffee) 45deg
    fail_color  = rgba(ff5566ee) rgba(ff0066ee) 40deg

    font_color = $text
    font_family = $font
    placeholder_text = <i>Nhập mật khẩu...</i>
    fail_text = <i>$PAMFAIL</i>

    fade_on_empty = true
    rounding = 12

    dots_size = 0.35
    dots_spacing = 0.3
    dots_center = true

    # đổi màu khi bật Caps Lock
    capslock_color = rgba(ffd27dee)

    position = 0, -132
    halign = center
    valign = center
}

# ── Góc dưới: pin (cập nhật mỗi 10s) ──
label {
    monitor =
    text = cmd[update:10000] echo "$(cat /sys/class/power_supply/BAT1/capacity)%"
    font_size = 16
    font_family = $font
    color = $text_dim

    position = 30, 28
    halign = left
    valign = bottom
}

# ── Góc dưới: phím tắt gợi ý ──
label {
    monitor =
    text = <i>Enter để mở khóa · ESC xóa</i>
    font_size = 13
    font_family = $font
    color = rgba(238, 242, 246, 0.4)

    position = 0, 28
    halign = center
    valign = bottom
}
