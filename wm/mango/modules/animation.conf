# Enable Animations 
animations=1
layer_animations=1

# Tag Animation Direction
# 1: horizontal, 0: vertical
tag_animation_direction=1

# Animation types:slide,zoom,fade,none
animation_type_open=zoom
animation_type_close=zoom
layer_animation_type_open=slide
layer_animation_type_close=slide

# Fade settings
animation_fade_in=1
animation_fade_out=1
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8

# Zoom settings 
zoom_initial_ratio=0.4
zoom_end_ratio=0.8

# Durations
animation_duration_move=500
animation_duration_open=500
animation_duration_tag=500
animation_duration_close=250
animation_duration_focus=150

# Custom Bezier Curvers
animation_curve_open=0.34,1.3,0.64,1
animation_curve_move=0.34,1.3,0.64,1
animation_curve_tag=0.34,1.3,0.64,1
animation_curve_close=0.36,-0.6,0.32,1
animation_curve_focus=0.16,1,0.3,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5
animation_curve_opafadein=0.46,1.0,0.29,1

